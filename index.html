<meta charset="utf-8">
<title>reblu</title>
<style>
  :root { --bg:#0e1116; --fg:#e6e6e6; --mut:#8b98a5; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; }
  #hud { display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #c { background:#161b22; border-radius:8px; max-width:min(92vmin,640px); max-height:min(92vmin,640px); touch-action:none; box-shadow:0 8px 32px #0008; }
  .mut { color:var(--mut); } b { font-size:18px; }
  kbd { background:#222a33; border-radius:4px; padding:1px 5px; }
  #banner { font-size:20px; font-weight:700; min-height:26px; transition:opacity .2s; }
  #timerbar { width:min(92vmin,640px); height:4px; background:#222a33; border-radius:2px; overflow:hidden; }
  #timerfill { height:100%; background:#58a6ff; width:0%; transition:width .1s linear; }
  #dice { position:fixed; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; font-size:80px; z-index:5; }
  #dice.show { display:flex; animation:dicepop .9s ease-out forwards; }
  @keyframes dicepop { 0%{transform:scale(.3) rotate(-30deg);opacity:0} 25%{opacity:1} 60%{transform:scale(1.1) rotate(6deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:0} }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000a; font-size:36px; font-weight:800; z-index:10; animation:winpop .4s ease-out; }
  @keyframes winpop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  #panel { display:flex; flex-direction:column; gap:6px; width:230px; }
  #panel h3 { margin:6px 0 0; font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid #30363d; padding-bottom:3px; }
  #panel h3:first-child { margin-top:0; }
  #panel label { font-size:13px; color:var(--fg); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #panel .step { display:inline-flex; align-items:center; gap:3px; }
  #panel .step button { width:22px; height:24px; background:#222a33; color:var(--fg); border:1px solid #30363d; border-radius:4px; cursor:pointer; font:inherit; line-height:1; }
  #panel .step button:hover { background:#2d3742; }
  #panel input[type=number] { width:46px; background:#0e1116; color:var(--fg); border:1px solid #30363d; border-radius:4px; padding:2px 2px; font:inherit; text-align:center; -moz-appearance:textfield; }
  #panel input::-webkit-outer-spin-button, #panel input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:baseline; }
  #lobby { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000a; z-index:9; }
  #lobby[hidden] { display:none; }
  #nameentry { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:20; flex-direction:column; gap:18px; }
  #nameentry[hidden] { display:none; }
  #nameentry h1 { font-size:44px; margin:0; letter-spacing:.06em; }
  #nameentry h1 em { font-style:normal; color:#f85149; }
  #nameentry .sub { color:var(--mut); }
  #necells { display:flex; gap:10px; }
  #necells .ne { width:58px; height:68px; background:#161b22; border:2px solid #30363d; border-radius:10px; color:var(--fg); font:700 34px system-ui,sans-serif; text-align:center; text-transform:uppercase; caret-color:#58a6ff; }
  #necells .ne:focus { outline:none; border-color:#58a6ff; box-shadow:0 0 0 3px #58a6ff33; }
  #necells .ne.pop { animation:nepop .18s ease-out; }
  @keyframes nepop { from { transform:scale(.7); } to { transform:scale(1); } }
  #join { font:inherit; font-weight:800; font-size:18px; padding:10px 42px; border:0; border-radius:8px; background:#2ea043; color:#fff; cursor:pointer; }
  #join:disabled { background:#2a2f36; color:#8b98a5; cursor:default; }
  #lobbybox { background:#161b22; border-radius:10px; padding:18px 22px; min-width:240px; display:flex; flex-direction:column; gap:10px; box-shadow:0 8px 32px #000a; }
  #lobbybox h2 { margin:0; }
  #plist { display:flex; flex-direction:column; gap:4px; font-size:15px; }
  #plist .prow { display:flex; align-items:center; gap:7px; }
  #plist .pstat { margin-left:auto; color:var(--mut); font-size:13px; }
  #begin { font:inherit; font-weight:800; font-size:18px; padding:10px 0; border:0; border-radius:8px; background:#2ea043; color:#fff; cursor:pointer; }
  #begin:disabled { background:#2a2f36; color:#8b98a5; cursor:default; }
</style>

<div id="hud">
  <span id="banner"></span>
</div>
<div id="timerbar"><div id="timerfill"></div></div>
<canvas id="c"></canvas>
<div class="mut">WASD / arrows / gamepad · <kbd>Enter</kbd>/<kbd>Space</kbd> or A = end turn early</div>
<div id="score" class="mut"></div>
<div id="dice"></div>
<div id="overlay"></div>
<div id="nameentry">
  <h1>reb<em>lu</em></h1>
  <div class="sub">pick your callsign — 4 letters or digits</div>
  <div id="necells">
    <input class="ne" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <input class="ne" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <input class="ne" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <input class="ne" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false">
  </div>
  <button id="join" disabled>JOIN</button>
  <div class="sub" id="nehint"></div>
</div>
<div id="lobby" hidden>
  <div id="lobbybox">
    <h2>Lobby</h2>
    <div id="plist"></div>
    <div id="panel"></div>
    <button id="begin">BEGIN</button>
    <div class="mut" id="lobbyhint"></div>
  </div>
</div>

<script>
const S = { me: null, st: null, ws: null, lastStateAt: 0, turnMsAtRecv: 0, lastTurnKey: '', ents: new Map(), blastFx: [] };
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');

// same-origin WS by default; hosted statically (e.g. GitHub Pages), point at the game server: ?srv=https://reblu.onrender.com
const SRV = new URL(location.href).searchParams.get('srv') || location.origin;

let name = null;

// ---- callsign entry: four single-char cells, impossible to exceed 4 chars ----
function nameEntryUI() {
  const ne = document.getElementById('nameentry');
  ne.hidden = false;
  const cells = [...document.querySelectorAll('.ne')];
  const btn = document.getElementById('join');
  const hint = document.getElementById('nehint');
  const val = () => cells.map(c => c.value).join('');
  const refresh = () => { btn.disabled = !val(); hint.textContent = val() ? 'joining as ' + val() : ''; };
  const join = () => {
    if (!val()) return;
    btn.disabled = true;
    ne.hidden = true;
    name = val();
    connect();
  };
  cells.forEach((c, i) => {
    c.addEventListener('input', () => {
      c.value = c.value.replace(/[^a-zA-Z0-9]/g, '').slice(-1).toUpperCase();
      c.classList.remove('pop'); void c.offsetWidth; if (c.value) c.classList.add('pop');
      if (c.value && i < 3) cells[i + 1].focus();
      refresh();
    });
    c.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !c.value && i > 0) { cells[i - 1].value = ''; cells[i - 1].focus(); refresh(); }
      else if (e.key === 'Enter' && val()) join();
      else if (e.key === 'ArrowLeft' && i > 0) cells[i - 1].focus();
      else if (e.key === 'ArrowRight' && i < 3) cells[i + 1].focus();
    });
    c.addEventListener('paste', e => {
      e.preventDefault();
      const text = (e.clipboardData.getData('text') || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 4).toUpperCase();
      [...text].forEach((ch, j) => { if (cells[j]) cells[j].value = ch; });
      cells[Math.min(text.length, 3)].focus();
      refresh();
    });
  });
  btn.addEventListener('click', join);
  cells[0].focus();
}

function connect() {
  const ws = new WebSocket(SRV.replace(/^http/, 'ws'));
  S.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', name }));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') S.me = m.id;
    else if (m.t === 'state') onState(m);
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

// ?name=abcd skips the entry screen; otherwise four-cell callsign UI
if (new URL(location.href).searchParams.get('name')) name = new URL(location.href).searchParams.get('name');
if (name) connect(); else nameEntryUI();

function onState(m) {
  // new turn -> dice pop
  const turnKey = m.tick + ':' + m.turnId;
  if (m.phase === 'move' && turnKey !== S.lastTurnKey) {
    S.lastTurnKey = turnKey;
    const tp = m.players.find(p => p.id === m.turnId);
    if (tp) showDice(tp.roll, tp.id === S.me);
  }
  // blast effect trigger
  if (m.blasts.length && (!S.st || S.st.blasts !== m.blasts))
    S.blastFx = m.blasts.map(b => ({ ...b, t0: performance.now() }));
  // goal teleport trigger
  if (m.goalJump && (!S.st || S.st.goalJump !== m.goalJump))
    S.goalFx = { ...m.goalJump, t0: performance.now() };
  S.st = m; S.lastStateAt = performance.now(); S.turnMsAtRecv = m.turnMsLeft;
  // sync smooth entities
  syncEnts(m);
  // tuning panel follows server cfg
  if (m.cfg) syncPanel(m.cfg);
}

// ---- settings panel (lobby): categories, -/+ steppers, typeable values ----
const FIELDS = [
  { cat: 'Blue dots' },
  { k: 'blueEvery', label: 'Spawn every', suffix: 'turns', min: 1, max: 10 },
  { k: 'blueSpeed', label: 'Base speed', min: 1, max: 6 },
  { k: 'blueCount', label: 'Spawn count', min: 1, max: 5 },
  { k: 'blueCombined', label: 'Combined speed', display: true },
  { cat: 'Red dots' },
  { k: 'redEvery', label: 'Spawn every', suffix: 'turns', min: 1, max: 10 },
  { k: 'redSpeed', label: 'Base speed', min: 1, max: 6 },
  { k: 'redCount', label: 'Spawn count', min: 1, max: 5 },
  { k: 'redCombined', label: 'Combined speed', display: true },
  { cat: 'Board' },
  { k: 'sizeX', label: 'Width', suffix: 'cells', min: 15, max: 40 },
  { k: 'sizeY', label: 'Height', suffix: 'cells', min: 15, max: 40 },
  { k: 'obs', label: 'Obstacles', min: 0, max: 100 },
];
const IN = {};
{
  const panel = document.getElementById('panel');
  for (const f of FIELDS) {
    if (f.cat) { const h = document.createElement('h3'); h.textContent = f.cat; panel.appendChild(h); continue; }
    const lb = document.createElement('label');
    const name = document.createElement('span'); name.textContent = f.label; lb.appendChild(name);
    if (f.display) {
      const s = document.createElement('span'); s.className = 'mut'; IN[f.k] = s; lb.appendChild(s);
    } else {
      const wrap = document.createElement('span'); wrap.className = 'step';
      const minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '-';
      const input = document.createElement('input'); input.type = 'number'; input.min = f.min; input.max = f.max;
      const plus = document.createElement('button'); plus.type = 'button'; plus.textContent = '+';
      wrap.append(minus, input, plus); lb.appendChild(wrap);
      if (f.suffix) lb.appendChild(Object.assign(document.createElement('span'), { textContent: f.suffix, className: 'mut' }));
      IN[f.k] = input;
      const send = v => {
        v = Math.max(f.min, Math.min(f.max, v | 0));
        if (S.ws.readyState === 1) S.ws.send(JSON.stringify({ t: 'config', [f.k]: v }));
      };
      minus.addEventListener('click', () => send((+input.value || f.min) - 1));
      plus.addEventListener('click', () => send((+input.value || f.min) + 1));
      input.addEventListener('change', () => { if (input.value !== '') send(+input.value); });
    }
    panel.appendChild(lb);
  }
}

function syncPanel(cfg) {
  for (const f of FIELDS) if (f.k && !f.display) IN[f.k].value = cfg[f.k];
  IN.blueCombined.textContent = (cfg.blueSpeed + 2) + ' (merged)';
  IN.redCombined.textContent = cfg.redSpeed + ' (no boost)';
}

document.getElementById('begin').addEventListener('click', () => {
  if (S.ws.readyState === 1) S.ws.send(JSON.stringify({ t: 'begin' }));
});

function showDice(roll, mine) {
  const el = document.getElementById('dice');
  el.textContent = mine ? `roll ${roll}` : '';
  if (!mine) return;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

// smooth-position registry: id -> {x,y,tx,ty}
function syncEnts(m) {
  const seen = new Set();
  const touch = (id, x, y) => {
    seen.add(id);
    let e = S.ents.get(id);
    if (!e) { e = { x, y, tx: x, ty: y }; S.ents.set(id, e); }
    else { e.tx = x; e.ty = y; }
  };
  for (const p of m.players) touch('p' + p.id, p.x, p.y);
  for (const b of m.blues) touch('b' + b.id, b.x, b.y);
  for (const r of m.reds) touch('r' + r.id, r.x, r.y);
  for (const k of S.ents.keys()) if (!seen.has(k)) S.ents.delete(k);
}

const myTurn = () => S.st && S.st.phase === 'move' && S.st.turnId === S.me;
function step(dx, dy) {
  if (!myTurn()) return;
  const me = S.st.players.find(p => p.id === S.me);
  if (!me || me.used >= me.roll) return;
  if (S.ws.readyState === 1) S.ws.send(JSON.stringify({ t: 'step', dx, dy }));
}
function doneTurn() { if (myTurn() && S.ws.readyState === 1) S.ws.send(JSON.stringify({ t: 'done' })); }

const KEYS = { w:[0,-1], arrowup:[0,-1], s:[0,1], arrowdown:[0,1], a:[-1,0], arrowleft:[-1,0], d:[1,0], arrowright:[1,0] };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) { e.preventDefault(); step(...KEYS[k]); }
  else if (k === 'enter' || k === ' ') { e.preventDefault(); doneTurn(); }
});

let padPrev = {};
(function pollPad() {
  const gp = navigator.getGamepads && [...navigator.getGamepads()].find(Boolean);
  if (gp) {
    const ax = Math.abs(gp.axes[0]) > 0.5 ? Math.sign(gp.axes[0]) : 0;
    const ay = Math.abs(gp.axes[1]) > 0.5 ? Math.sign(gp.axes[1]) : 0;
    const cur = {
      up: gp.buttons[12]?.pressed || ay < 0, down: gp.buttons[13]?.pressed || ay > 0,
      left: gp.buttons[14]?.pressed || ax < 0, right: gp.buttons[15]?.pressed || ax > 0,
      a: gp.buttons[0]?.pressed,
    };
    if (cur.up && !padPrev.up) step(0, -1);
    if (cur.down && !padPrev.down) step(0, 1);
    if (cur.left && !padPrev.left) step(-1, 0);
    if (cur.right && !padPrev.right) step(1, 0);
    if (cur.a && !padPrev.a) doneTurn();
    padPrev = cur;
  }
  requestAnimationFrame(pollPad);
})();

function draw(now) {
  const size = Math.min(innerWidth, innerHeight) * 0.9;
  const clamped = Math.min(size, 640);
  const st = S.st;
  const w = (st && st.w) || 25, h = (st && st.h) || 25;
  const cell = clamped / Math.max(w, h);
  cvs.width = Math.round(w * cell); cvs.height = Math.round(h * cell);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.strokeStyle = '#21262d';
  for (let i = 0; i <= w; i++) {
    ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,cvs.height); ctx.stroke();
  }
  for (let i = 0; i <= h; i++) {
    ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(cvs.width,i*cell); ctx.stroke();
  }
  if (!st) { requestAnimationFrame(draw); return; }

  // advance lerp toward targets (critically-damped-ish, frame-rate friendly)
  for (const e of S.ents.values()) {
    const f = 0.22;
    e.x += (e.tx - e.x) * f; e.y += (e.ty - e.y) * f;
    if (Math.abs(e.tx - e.x) < 0.02) e.x = e.tx;
    if (Math.abs(e.ty - e.y) < 0.02) e.y = e.ty;
  }
  const at = (x, y) => [(x + 0.5) * cell, (y + 0.5) * cell];

  // start / goal
  const [gx, gy] = st.goal || [w - 1, h - 1];
  ctx.fillStyle = '#2ea043'; ctx.fillRect(0, 0, cell, cell);
  const pulse = 0.75 + 0.25 * Math.sin(now / 300);
  ctx.fillStyle = `rgba(255,213,79,${pulse})`; ctx.fillRect(gx*cell, gy*cell, cell, cell);
  ctx.font = `bold ${cell*0.32}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#6b5b00'; ctx.fillText('GOAL', ...at(gx, gy));

  // goal teleport fx: implosion ring at the old spot, burst at the new one
  S.goalFx = S.goalFx && now - S.goalFx.t0 < 900 ? S.goalFx : null;
  if (S.goalFx) {
    const t = (now - S.goalFx.t0) / 900;
    const [fx0, fy0] = S.goalFx.from, [fx1, fy1] = S.goalFx.to;
    // collapsing ring + fading tile at the old spot
    const oldA = 1 - t;
    ctx.strokeStyle = `rgba(255,213,79,${oldA})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(...at(fx0, fy0), cell * (2.2 * (1 - t) + 0.3), 0, 7); ctx.stroke();
    ctx.fillStyle = `rgba(255,213,79,${oldA * 0.5})`;
    ctx.fillRect(fx0*cell, fy0*cell, cell, cell);
    // expanding ring + rising tile at the new spot
    ctx.strokeStyle = `rgba(255,213,79,${Math.min(1, 2 * t)})`;
    ctx.beginPath(); ctx.arc(...at(fx1, fy1), cell * (0.3 + 2.2 * t), 0, 7); ctx.stroke();
    if (t < 0.5) {
      ctx.fillStyle = `rgba(255,240,180,${(1 - t * 2) * 0.8})`;
      ctx.fillRect(fx1*cell, fy1*cell, cell, cell);
    }
  }

  // obstacles
  ctx.fillStyle = '#3a3f45';
  for (const [x, y] of st.obs) { ctx.beginPath(); ctx.roundRect(x*cell+1.5, y*cell+1.5, cell-3, cell-3, 3); ctx.fill(); }

  // dots
  for (const b of st.blues) {
    const e = S.ents.get('b' + b.id); if (!e) continue;
    const [cx, cy] = at(e.x, e.y);
    if (b.boost) { // merge-boost glow
      const g = 0.5 + 0.5 * Math.sin(now / 120);
      ctx.fillStyle = `rgba(88,166,255,${0.25 + 0.3 * g})`;
      ctx.beginPath(); ctx.arc(cx, cy, cell * (0.45 + 0.15 * g), 0, 7); ctx.fill();
    }
    ctx.fillStyle = b.boost ? '#79b8ff' : '#1f6feb';
    ctx.beginPath(); ctx.arc(cx, cy, cell * 0.32, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.arc(cx - cell*0.08, cy - cell*0.08, cell*0.08, 0, 7); ctx.fill();
  }
  for (const r of st.reds) {
    const e = S.ents.get('r' + r.id); if (!e) continue;
    const [cx, cy] = at(e.x, e.y);
    const wob = Math.sin(now / 150 + r.id) * cell * 0.04;
    ctx.fillStyle = '#f85149';
    ctx.beginPath(); ctx.arc(cx, cy + wob, cell * 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd0cc'; ctx.beginPath(); ctx.arc(cx - cell*0.07, cy - cell*0.07 + wob, cell*0.07, 0, 7); ctx.fill();
  }

  // players (bounce slightly while riding)
  for (const p of st.players) {
    const e = S.ents.get('p' + p.id); if (!e) continue;
    const ride = p.rider ? Math.abs(Math.sin(now / 200)) * cell * 0.12 : 0;
    const [cx, cy] = at(e.x, e.y);
    ctx.globalAlpha = p.dead ? 0.25 : 1;
    if (p.id === st.turnId && st.phase === 'move') { // active-player ring
      ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 2;
      const rr = cell * (0.55 + 0.07 * Math.sin(now / 160));
      ctx.beginPath(); ctx.arc(cx, cy - ride, rr, 0, 7); ctx.stroke();
    }
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.roundRect(cx - cell*0.38, cy - cell*0.38 - ride, cell*0.76, cell*0.76, 4); ctx.fill();
    if (p.rider) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = '#0009'; ctx.font = `${cell*0.45}px system-ui`;
    ctx.fillText(p.name.slice(0, 2), cx, cy - ride);
    ctx.globalAlpha = 1;
  }

  // blast fx: expanding flash that fades
  S.blastFx = S.blastFx.filter(fx => now - fx.t0 < 800);
  for (const fx of S.blastFx) {
    const t = (now - fx.t0) / 800;
    const a = (1 - t) * 0.9;
    for (const [x, y] of fx.cells) {
      const d = Math.abs(x - fx.x) + Math.abs(y - fx.y);
      const local = Math.max(0, t * 1.4 - d * 0.12); // shockwave ripple outward
      ctx.fillStyle = `rgba(255,120,90,${a * Math.min(1, local * 3)})`;
      ctx.fillRect(x*cell, y*cell, cell, cell);
    }
    const [cx, cy] = at(fx.x, fx.y);
    ctx.strokeStyle = `rgba(255,200,120,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, cell * (0.4 + t * 2.2), 0, 7); ctx.stroke();
  }

  // hud: banner + timer
  const me = st.players.find(p => p.id === S.me);
  const banner = document.getElementById('banner');
  // lobby: player list + Begin gate
  const lb = document.getElementById('lobby');
  if (st.phase === 'lobby') {
    lb.hidden = false;
    document.getElementById('plist').innerHTML =
      st.players.map(p => `<div class="prow"><span class="sw" style="background:${p.color}"></span><span style="color:${p.color}">${p.name}</span>${p.id === S.me ? ' (you)' : ''}<span class="pstat">${p.ready ? 'ready' : 'waiting'}</span></div>`).join('');
    const iReady = me && me.ready;
    const b = document.getElementById('begin');
    b.disabled = !me; // clickable until you declare ready
    b.textContent = iReady ? 'waiting for others...' : 'READY';
    document.getElementById('lobbyhint').textContent =
      st.players.filter(p => p.ready).length + ' / ' + st.players.length + ' ready — game starts when all press Ready';
    banner.textContent = 'lobby — press Begin when ready'; banner.style.color = '#8b98a5';
    document.getElementById('timerfill').style.width = '0%';
  } else lb.hidden = true;
  if (st.phase === 'move' && st.turnId) {
    const tp = st.players.find(p => p.id === st.turnId);
    const left = Math.max(0, S.turnMsAtRecv - (now - S.lastStateAt));
    document.getElementById('timerfill').style.width = (100 * left / 8000) + '%';
    banner.innerHTML = tp.id === S.me
      ? `Your turn — roll ${tp.roll}, moves left: <b>${tp.roll - tp.used}</b>`
      : `${tp.name}'s turn — roll ${tp.roll}, moves left: ${tp.roll - tp.used}`;
    banner.style.color = tp.color;
  } else if (st.phase === 'dots') {
    banner.textContent = '…dots on the move…'; banner.style.color = '#8b98a5';
    document.getElementById('timerfill').style.width = '0%';
  }
  document.getElementById('score').textContent =
    st.players.map(p => `${p.dead ? '[out] ' : ''}${p.name}${p.id === S.me ? ' (you)' : ''}: ${p.wins}`).join(' · ');
  const ov = document.getElementById('overlay');
  if (st.phase === 'over') { ov.style.display = 'flex'; ov.textContent = `${st.winner} wins!`; }
  else ov.style.display = 'none';

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
